version: 2
updates:
  # .NET (NuGet) — delete this block if the project isn't .NET.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "[YOUR SCHEDULE INTERVAL, e.g. weekly]"
    # Wait 3 days after a release before proposing it: a hijacked or broken release is
    # usually yanked within that window, before it ever reaches this repo.
    cooldown:
      default-days: 3
    # One PR for all minor/patch bumps instead of one per package; majors still get their
    # own PR, since those are the ones that can need code changes.
    groups:
      nuget-minor-and-patch:
        update-types: ["minor", "patch"]

  # Node (npm) — delete this block if the project isn't Node.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "[YOUR SCHEDULE INTERVAL, e.g. weekly]"
    cooldown:
      default-days: 3
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions — keeps the actions used by the workflows in .github/workflows/ up to
  # date (e.g. actions/checkout, actions/setup-dotnet). Only that folder is scanned, so the
  # originals left in templates/ci/ are not updated. Safe to keep even if you deleted one
  # of the ecosystem blocks above.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "[YOUR SCHEDULE INTERVAL, e.g. weekly]"
    cooldown:
      default-days: 3
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
