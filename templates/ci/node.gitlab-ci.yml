image: node:[YOUR NODE VERSION, e.g. 20]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

build-and-test:
  stage: test
  # Cache npm's download cache, not node_modules/ -- `npm ci` deletes node_modules/ before
  # installing, so a cached copy of it is thrown away on every run.
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - npm test