name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR makes the in-progress run obsolete -- cancel it instead
# of letting both finish. Pushes to main are never cancelled, so every main commit gets a run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "[YOUR NODE VERSION, e.g. 20]"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
