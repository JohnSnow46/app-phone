name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR makes the in-progress run obsolete -- cancel it instead
# of letting both finish. Pushes to main are never cancelled, so every main commit gets a run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "[YOUR .NET VERSION, e.g. 8.0.x]"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release
